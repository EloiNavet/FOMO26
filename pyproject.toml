[project]
name = "asparagus"
version = "0.4.6"
authors = [
  { name="Éloi Navet" },
  { name="Rémi Giraud" },
  { name="Boris Mansencal" },
  { name="Pierrick Coupé" },
]
description = "Team volBrain's FOMO26 challenge submission: a ResEnc-B backbone pretrained with an AMAES masked-reconstruction objective"
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
keywords = ["deep learning", "medical image analysis", "foundation models", "brain MRI", "self-supervised learning"]


dependencies = [
    # The submitted lineage used 0.3.2, and so does every checkpoint and forward-digest
    # measurement behind this release. The writer dispatches on signature, so 0.3.5 also works --
    # this pin buys parity fidelity, not a bug fix. See docs/ENVIRONMENTS.md.
    "gardening_tools==0.3.2",
    "pandas>=2.2.0",
    "lightning==2.4.0",
    "nibabel>=5.3.2",
    "numpy>=1.23.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "Pillow>=12.0.0",
    "python-dotenv>=1.0.0",
    "torch==2.7.0",
    "torchmetrics>=1.7.2",
    "torchvision==0.22.0",
    "wandb>=0.23.0",
    "huggingface-hub>=1.5.0",
    "lightly>=1.5.22",
    "einops>=0.8.2",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.8.0",
    "umap-learn>=0.5.7",
    "transformers"
]


[dependency-groups]
dcai = [
    "torch==2.7.0",
    "hydra-core>=1.3.2",
    "torchmetrics>=1.7.2",
    "lightning==2.4.0",
    "monai==1.5.2",
    "pandas>=2.2.2,<3.0.0",
    "wandb==0.26.1",
    "timm<=1.0.14",
    "scikit-learn==1.8.0",
    "umap-learn>=0.5.7",
    "einops==0.8.2",
]
preprocessing = [
    "scikit-image>=0.21.0",
    "polars>=1.0.0",
    "tqdm>=4.66.0",
    "openpyxl",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
extras = [
    "gardening_tools[extras]>=0.1.1",
    "mlflow>=3.0.0",
    "timm<=1.0.14",
    "monai>=1.3.2",

]

test = [
    "ruff>=0.14.8",
    "pytest>=9.0.1",
    "scikit-learn>=1.7.2",
    "pytest-timeout>=2.3.0",
]


[project.scripts]
asp_getid = 'asparagus.pipeline.run.get_id:main'
asp_pretrain = 'asparagus.pipeline.run.pretrain:main'

asp_train_cls = 'asparagus.pipeline.run.train_cls:main'
asp_train_seg = 'asparagus.pipeline.run.train_seg:main'
asp_train_reg = 'asparagus.pipeline.run.train_reg:main'

asp_test_cls = 'asparagus.pipeline.run.test_cls:main'
asp_test_seg = 'asparagus.pipeline.run.test_seg:main'
asp_test_reg = 'asparagus.pipeline.run.test_cls:main'

asp_finetune_seg = 'asparagus.pipeline.run.finetune_seg:main'
asp_finetune_cls = 'asparagus.pipeline.run.finetune_cls:main'
asp_finetune_reg = 'asparagus.pipeline.run.finetune_reg:main'
asp_linear_probe = 'asparagus.pipeline.run.linear_probe:main'

asp_eval_box_run = 'asparagus.pipeline.run.eval_box:main'
asp_eval_box_prepare_data = 'asparagus.pipeline.run.eval_box:prepare_data'
asp_eval_box_collect_results = 'asparagus.pipeline.run.eval_box:collect_results'


[tool.setuptools.packages.find]
include = ["asparagus*", "finetuning*"]

[project.urls]
"Homepage" = "https://github.com/EloiNavet/FOMO26"
"Upstream framework" = "https://github.com/Sllambias/asparagus"


[build-system]
requires = ["setuptools>=75.8", "wheel>=0.45"]
build-backend = "setuptools.build_meta"


[tool.ruff]
line-length = 127


[tool.ruff.lint]
# "E": style/error codes (PEP 8–type errors, e.g. if x == None).
# "F": Pyflakes-style errors (unused variables, undefined names, etc.).
# "I": import-related issues (import order, duplicates, etc.).
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
no-sections = true
combine-as-imports = true

[tool.ruff.format]
# quote-style = "double": Ruff prefers " over ' when it reformats strings, as long as it’s safe.
# indent-style = "space": indentation uses spaces, not tabs.
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
# addopts = "-ra -q" adds default CLI options:
#     -q: quiet mode (less verbose).
#     -ra: show a short summary of skipped/failed/xpassed tests at the end.
# testpaths: the suites a bare `pytest` (as run by .github/workflows/ci.yaml) discovers.
#     "tests" - asparagus runtime, architectures, SSL objectives, pipelines, and the FOMO26
#               release contracts. "finetuning/tests" held the Task-5 campaign suite; that
#               campaign is not part of the public code release, and the one module there
#               with a subject that survives (matched-control equivalence, which exercises
#               ssl/views.py) moved into "tests".
# This is the single authoritative discovery scope; CI must not duplicate it as CLI arguments.
addopts = "-ra -q"
testpaths = ["tests"]
# Markers let a targeted run select one concern instead of a whole directory. The full suite is
# unchanged: an unmarked run still collects everything under testpaths.
#     reconciliation - contracts introduced by the canonical reconciliation (checkpoint and
#                      prediction identity, metrics provenance, D0 collection, safety-lane
#                      composition, runtime script tracking). Pure, offline, no GPU.
#     slow           - tests that build models, compose many configs or shell out repeatedly.
markers = [
    "reconciliation: canonical reconciliation contracts (offline, fast)",
    "slow: builds models, composes many configs, or shells out repeatedly",
]
