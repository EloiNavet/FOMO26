defaults:
  - core/base@
  - hardware/1gpu40cpu@hardware
  - _self_

task:
checkpoint_run_id:
load_checkpoint_name: last.ckpt
test_checkpoint: best   # which finetuned checkpoint to run inference on: best | last
root: base
stem: ${checkpoint_run_id}_${load_checkpoint_name}

model:
  net: ${model.cls_net}
  ckpt_every_n_epoch: 25

lightning:
  data_module: ClsRegDataModule
  lightning_module: RegressionModule

# Post-fit evaluation. Disabled by default so a finetune run never crashes after training; the run
# logs that it skipped the test. Set testing.run_after_fit=true to run trainer.test on the test split.
testing:
  run_after_fit: false

data:
  data_path: ${oc.env:ASPARAGUS_DATA}/${task}
  train_split: split_75_15_10
  fold: 0

training:
  epochs: 50
  batch_size: 2
  limit_train_batches: 250
  limit_val_batches: 50
  target_size: [128, 128, 128]
  seed: ${random:0,1000000}
  accumulate_grad_batches: 1
  warmup_epochs: 0
  check_val_every_n_epoch: 1
  repeat_stem_weights: True
  load_decoder: True

transforms:
  cpu_tr_transforms: CPU_clsreg_train_transforms_crop
  cpu_val_transforms: CPU_clsreg_val_test_transforms_crop
  gpu_tr_transforms: GPU_all_train_transforms
  gpu_val_transforms:
  normalize: True

logger:
  progress_bar: True
  profile: False
  wandb_log_model: False
  wandb_logging: True
  wandb_entity: ${oc.env:WANDB_ENTITY, "volBrain_team"}
  wandb_project: Finetune
  mlflow_logging: False
  log_every_n_steps: 250
  log_images_every_n_epoch: 5
  log_to_stdout: True
